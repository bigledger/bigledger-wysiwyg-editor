<div class="cp-popover" role="dialog" [attr.aria-label]="(mode === 'text' ? 'Text' : 'Background') + ' color picker'" (mousedown)="$event.stopPropagation()">
  <div class="cp-grid">
    <ng-container *ngFor="let row of palette">
      <button
        *ngFor="let color of row"
        type="button"
        class="cp-swatch"
        [class.cp-swatch--active]="isSwatchActive(color)"
        [style.background-color]="color"
        [attr.data-color]="color"
        [attr.aria-label]="'Apply color ' + color"
        [attr.title]="color"
        (mousedown)="$event.preventDefault()"
        (click)="pickSwatch(color)">
        <span class="cp-swatch-check" *ngIf="isSwatchActive(color)" aria-hidden="true">✓</span>
      </button>
    </ng-container>
  </div>

  <form class="cp-hex-row" (ngSubmit)="onHexSubmit(); $event.preventDefault()">
    <input
      type="text"
      class="cp-hex"
      maxlength="7"
      autocomplete="off"
      spellcheck="false"
      placeholder="#000000"
      [value]="hexInput"
      (input)="onHexInputChange($any($event.target).value)"
      (keydown.enter)="onHexSubmit()" />
  </form>

  <button
    type="button"
    class="cp-remove"
    [class.cp-remove--active]="isRemoveActive()"
    (mousedown)="$event.preventDefault()"
    (click)="removeColor()">
    <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true">
      <path d="M2 2 L14 14 M14 2 L2 14" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    </svg>
    <span>Remove Color</span>
  </button>
</div>
