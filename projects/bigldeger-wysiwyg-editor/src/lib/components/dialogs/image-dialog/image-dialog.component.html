<div class="wysiwyg-image-dialog-overlay" *ngIf="visible" (click)="onCancel()">
  <div class="wysiwyg-image-dialog" (click)="$event.stopPropagation()">
    <form [formGroup]="imageForm" (ngSubmit)="onSubmit()">
      
      <!-- Dialog Header -->
      <div class="wysiwyg-image-dialog-header">
        <h3>{{ isEditing ? 'Edit Image' : 'Insert Image' }}</h3>
        <button 
          type="button" 
          class="wysiwyg-close-btn"
          aria-label="Close"
          (click)="onCancel()">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <!-- Tabs -->
      <div class="wysiwyg-tabs-container" *ngIf="!isEditing && hasMultipleInputModes">
        <div class="wysiwyg-tabs">
          <button 
            type="button"
            class="wysiwyg-tab"
            [class.active]="activeTab === 'upload'"
            (click)="switchTab('upload')">
            <span>UPLOAD</span>
          </button>
          <button 
            type="button"
            class="wysiwyg-tab"
            [class.active]="activeTab === 'url'"
            (click)="switchTab('url')">
            <span>BY URL</span>
          </button>
        </div>
      </div>

      <div class="wysiwyg-dialog-body">

        <!-- Upload Tab Content (First Tab) -->
        <div class="wysiwyg-tab-content" *ngIf="activeTab === 'upload' && allowFileUpload">
          
          <!-- Hidden File Input -->
          <input 
            #fileInput
            type="file"
            [attr.accept]="fileAccept"
            (change)="onFileSelected($event)"
            style="display: none">

          <!-- Simple Drop Zone (Froala Style) -->
          <div 
            class="wysiwyg-froala-drop-zone"
            [class.active]="isDragOver"
            [class.disabled]="isUploading"
            (click)="triggerFileInput()"
            (dragover)="onDragOver($event)"
            (dragleave)="onDragLeave($event)"
            (drop)="onDrop($event)">
            <div class="wysiwyg-drop-content">
              <div class="wysiwyg-drop-icon-simple">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                </svg>
              </div>
              <p class="wysiwyg-drop-text">Drop image</p>
              <p class="wysiwyg-drop-or">or click</p>
            </div>
          </div>

          <!-- File Status -->
          <div class="wysiwyg-file-status-simple" *ngIf="selectedFile || isUploading || uploadError">
            
            <!-- Selected File Info -->
            <div class="wysiwyg-file-info-simple" *ngIf="selectedFile && !isUploading && !uploadError">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
              </svg>
              <span>{{ selectedFile.name }} ({{ formatFileSize(selectedFile.size) }})</span>
            </div>

            <!-- Upload Progress -->
            <div class="wysiwyg-progress-simple" *ngIf="isUploading">
              <div class="wysiwyg-progress-bar-simple">
                <div class="wysiwyg-progress-fill" [style.width.%]="uploadProgress"></div>
              </div>
              <span class="wysiwyg-progress-text">Uploading... {{ uploadProgress }}%</span>
            </div>

            <!-- Error Message -->
            <div class="wysiwyg-error-simple" *ngIf="uploadError">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd" />
              </svg>
              <span>{{ uploadError }}</span>
            </div>

          </div>

        </div>

        <!-- URL Tab Content (Second Tab) -->
        <div class="wysiwyg-tab-content" *ngIf="activeTab === 'url' && allowUrlInput">
          <div class="wysiwyg-url-input-simple">
            <input 
              type="url" 
              formControlName="src"
              placeholder="http://"
              [class.error]="hasFieldError('src')"
              (input)="onUrlChange()">
            <div class="wysiwyg-error-simple" *ngIf="hasFieldError('src')">
              {{ getFieldError('src') }}
            </div>
          </div>
        </div>

        <!-- Image Properties (Simplified) -->
        <div class="wysiwyg-properties-section-simple" *ngIf="previewUrl || selectedFile">
          
          <!-- Image Preview -->
          <div class="wysiwyg-preview-simple" *ngIf="previewUrl">
            <img [src]="previewUrl" [alt]="imageForm.get('alt')?.value || 'Image preview'" />
          </div>

          <!-- Alt Text -->
          <div class="wysiwyg-form-group-simple">
            <label for="imageAlt">Alternate Text</label>
            <input 
              id="imageAlt"
              type="text" 
              formControlName="alt"
              placeholder="Image description"
              [class.error]="hasFieldError('alt')">
            <div class="wysiwyg-error-simple" *ngIf="hasFieldError('alt')">
              {{ getFieldError('alt') }}
            </div>
          </div>

          <!-- Dimensions -->
          <div class="wysiwyg-dimensions-simple">
            <div class="wysiwyg-form-group-simple">
              <label for="imageWidth">Width</label>
              <input 
                id="imageWidth"
                type="number" 
                formControlName="width"
                placeholder="Auto"
                min="1"
                max="2000">
            </div>

            <div class="wysiwyg-form-group-simple">
              <label for="imageHeight">Height</label>
              <input 
                id="imageHeight"
                type="number" 
                formControlName="height"
                placeholder="Auto"
                min="1"
                max="2000">
            </div>
          </div>

        </div>

      </div>

      <!-- Dialog Footer -->
      <div class="wysiwyg-dialog-footer-simple">
        <button 
          type="button" 
          class="wysiwyg-btn-simple wysiwyg-btn-cancel"
          (click)="onCancel()">
          Cancel
        </button>
        
        <button 
          type="submit" 
          class="wysiwyg-btn-simple wysiwyg-btn-insert"
          [disabled]="!isFormValid()">
          Insert
        </button>
      </div>

    </form>
  </div>
</div>
