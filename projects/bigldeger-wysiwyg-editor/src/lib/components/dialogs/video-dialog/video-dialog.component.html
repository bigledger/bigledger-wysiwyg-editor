<!-- Transparent overlay — click outside to dismiss -->
<div class="vd-overlay" *ngIf="visible" (click)="onCancel()">
  <div
    class="vd-popup"
    (click)="$event.stopPropagation()"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="isEditing ? 'Edit Video' : 'Insert Video'">

    <!-- ── Icon tab strip ──────────────────────────────────────────── -->
    <div class="vd-tabs" role="tablist">

      <!-- Tab: By URL (chain-link icon) -->
      <button
        type="button"
        class="vd-tab"
        [class.vd-tab--active]="activeTab === 'url'"
        (click)="setTab('url')"
        role="tab"
        [attr.aria-selected]="activeTab === 'url'"
        title="By URL"
        aria-label="Video URL tab">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/>
          <path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/>
        </svg>
      </button>

      <!-- Tab: Embedded Code (<> icon) -->
      <button
        type="button"
        class="vd-tab"
        [class.vd-tab--active]="activeTab === 'embed'"
        (click)="setTab('embed')"
        role="tab"
        [attr.aria-selected]="activeTab === 'embed'"
        title="Embedded Code"
        aria-label="Embedded code tab">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="16 18 22 12 16 6"/>
          <polyline points="8 6 2 12 8 18"/>
        </svg>
      </button>

      <!-- Tab: Upload Video (cloud-upload icon) -->
      <button
        type="button"
        class="vd-tab"
        [class.vd-tab--active]="activeTab === 'upload'"
        (click)="setTab('upload')"
        role="tab"
        [attr.aria-selected]="activeTab === 'upload'"
        title="Upload Video"
        aria-label="Upload video tab">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="16 16 12 12 8 16"/>
          <line x1="12" y1="12" x2="12" y2="21"/>
          <path d="M20.39 18.39A5 5 0 0018 9h-1.26A8 8 0 103 16.3"/>
        </svg>
      </button>

    </div><!-- /.vd-tabs -->
    <div class="vd-tabs-divider"></div>

    <!-- ── Tab: By URL ────────────────────────────────────────────── -->
    <div *ngIf="activeTab === 'url'" class="vd-body" role="tabpanel">
      <form [formGroup]="videoForm" (ngSubmit)="onSubmit()">

        <!-- Outlined floating-label input -->
        <div class="vd-field">
          <input
            id="vd-url"
            type="text"
            class="vd-input"
            [class.vd-input--error]="hasFieldError('url')"
            formControlName="url"
            placeholder=" "
            autocomplete="off">
          <label for="vd-url" class="vd-label">Paste in a video URL</label>
        </div>
        <div *ngIf="hasFieldError('url')" class="vd-error-msg">{{ getFieldError('url') }}</div>

        <!-- Footer: Autoplay (left) · Insert (right) -->
        <div class="vd-footer">
          <label class="vd-autoplay">
            <input type="checkbox" formControlName="autoplay" class="vd-checkbox">
            <span>Autoplay</span>
          </label>
          <button
            type="submit"
            class="vd-btn-insert"
            [disabled]="!videoForm.get('url')?.valid">
            Insert
          </button>
        </div>

      </form>
    </div>

    <!-- ── Tab: Embedded Code ─────────────────────────────────────── -->
    <div *ngIf="activeTab === 'embed'" class="vd-body" role="tabpanel">

      <div class="vd-field vd-field--textarea">
        <textarea
          id="vd-embed"
          class="vd-input vd-input--textarea"
          [(ngModel)]="embedCode"
          placeholder=" ">
        </textarea>
        <label for="vd-embed" class="vd-label">Embedded Code</label>
      </div>

      <div class="vd-footer vd-footer--end">
        <button
          type="button"
          class="vd-btn-insert"
          [disabled]="!embedCode.trim()"
          (click)="onSubmitEmbed()">
          Insert
        </button>
      </div>

    </div>

    <!-- ── Tab: Upload Video ──────────────────────────────────────── -->
    <div *ngIf="activeTab === 'upload'" class="vd-body" role="tabpanel">

      <div
        class="vd-dropzone"
        [class.vd-dropzone--over]="isDragOver && !uploadHandler"
        (click)="uploadHandler ? pickFromMediaLibrary() : videoFileInput.click()"
        (dragover)="!uploadHandler && onDragOver($event)"
        (dragleave)="isDragOver = false"
        (drop)="onFileDrop($event)">
        <input
          #videoFileInput
          type="file"
          accept="video/*"
          hidden
          (change)="onFileChange($event)">
        <ng-container *ngIf="isUploading">
          <p class="vd-drop-hint">{{ uploadHandler ? 'Opening media library…' : 'Uploading…' }}</p>
        </ng-container>
        <ng-container *ngIf="!uploadedFileName && !isUploading">
          <p class="vd-drop-title">Drop video</p>
          <p class="vd-drop-hint">(or click)</p>
        </ng-container>
        <ng-container *ngIf="uploadedFileName && !isUploading">
          <p class="vd-drop-title vd-drop-title--file">{{ uploadedFileName }}</p>
        </ng-container>
      </div>

      <div *ngIf="uploadError" class="vd-error-msg vd-error-msg--mt">{{ uploadError }}</div>

      <!-- Show Insert only in fallback file-picker mode (no handler) -->
      <div *ngIf="uploadedVideoUrl && !uploadHandler" class="vd-footer vd-footer--end vd-footer--mt">
        <button type="button" class="vd-btn-insert" (click)="onSubmitUpload()">Insert</button>
      </div>

    </div>

    <!-- ── Shared dimensions row (shown for all tabs) ───────────── -->
    <div class="vd-dimensions">
      <div class="vd-dim-field">
        <label class="vd-dim-label" for="vd-width">W</label>
        <input id="vd-width" type="number" class="vd-dim-input" [(ngModel)]="videoWidth" min="1" placeholder="640">
        <span class="vd-dim-unit">px</span>
      </div>
      <span class="vd-dim-sep">×</span>
      <div class="vd-dim-field">
        <label class="vd-dim-label" for="vd-height">H</label>
        <input id="vd-height" type="number" class="vd-dim-input" [(ngModel)]="videoHeight" min="1" placeholder="360">
        <span class="vd-dim-unit">px</span>
      </div>
    </div>

    <!-- ── Shared close button (bottom-right of popup) ───────────── -->    <button
      type="button"
      class="vd-close-btn"
      (click)="onCancel()"
      aria-label="Close video dialog">
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="2.5"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="18" y1="6" x2="6" y2="18"/>
        <line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>

  </div><!-- /.vd-popup -->
</div><!-- /.vd-overlay -->
