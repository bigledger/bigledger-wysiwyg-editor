<div class="wysiwyg-video-dialog-overlay" *ngIf="visible" (click)="onCancel()">
  <div class="wysiwyg-video-dialog" (click)="$event.stopPropagation()">
    <div class="wysiwyg-video-dialog-header">
      <h3>{{ isEditing ? 'Edit Video' : 'Insert Video' }}</h3>
      <button
        type="button"
        class="wysiwyg-video-dialog-close"
        (click)="onCancel()"
        aria-label="Close dialog">
        ×
      </button>
    </div>

    <!-- Tab strip -->
    <div class="wysiwyg-video-dialog-tabs">
      <button type="button"
        class="wysiwyg-video-dialog-tab"
        [class.wysiwyg-video-dialog-tab--active]="activeTab === 'url'"
        (click)="setTab('url')">By URL</button>
      <button type="button"
        class="wysiwyg-video-dialog-tab"
        [class.wysiwyg-video-dialog-tab--active]="activeTab === 'embed'"
        (click)="setTab('embed')">Embedded Code</button>
      <button type="button"
        class="wysiwyg-video-dialog-tab"
        [class.wysiwyg-video-dialog-tab--active]="activeTab === 'upload'"
        (click)="setTab('upload')">Upload Video</button>
    </div>

    <!-- Tab: By URL -->
    <form *ngIf="activeTab === 'url'" [formGroup]="videoForm" (ngSubmit)="onSubmit()" class="wysiwyg-video-dialog-form">
      <div class="wysiwyg-form-group">
        <label for="videoUrl">Video URL *</label>
        <input
          id="videoUrl"
          type="text"
          formControlName="url"
          placeholder="https://youtu.be/... or https://cdn.example.com/video.mp4"
          [class.error]="hasFieldError('url')"
          autocomplete="url">
        <div class="wysiwyg-video-dialog-hint">{{ detectedProviderLabel }}</div>
        <div class="wysiwyg-error-message" *ngIf="hasFieldError('url')">
          {{ getFieldError('url') }}
        </div>
      </div>

      <div class="wysiwyg-form-group">
        <label class="wysiwyg-video-dialog-checkbox-label">
          <input type="checkbox" formControlName="autoplay"> Autoplay
        </label>
      </div>

      <div class="wysiwyg-video-dialog-actions">
        <button type="button" class="wysiwyg-btn wysiwyg-btn-secondary" (click)="onCancel()">Cancel</button>
        <button type="submit" class="wysiwyg-btn wysiwyg-btn-primary" [disabled]="!videoForm.get('url')?.valid">
          {{ isEditing ? 'Update Video' : 'Insert Video' }}
        </button>
      </div>
    </form>

    <!-- Tab: Embedded Code -->
    <div *ngIf="activeTab === 'embed'" class="wysiwyg-video-dialog-form">
      <div class="wysiwyg-form-group">
        <label for="videoEmbedCode">Embedded Code *</label>
        <textarea
          id="videoEmbedCode"
          class="wysiwyg-video-dialog-embed-textarea"
          [(ngModel)]="embedCode"
          placeholder="Paste your &lt;iframe&gt; or embed code here...">
        </textarea>
      </div>
      <div class="wysiwyg-video-dialog-actions">
        <button type="button" class="wysiwyg-btn wysiwyg-btn-secondary" (click)="onCancel()">Cancel</button>
        <button type="button" class="wysiwyg-btn wysiwyg-btn-primary"
          [disabled]="!embedCode.trim()"
          (click)="onSubmitEmbed()">
          Insert Video
        </button>
      </div>
    </div>

    <!-- Tab: Upload Video -->
    <div *ngIf="activeTab === 'upload'" class="wysiwyg-video-dialog-form">
      <div
        class="wysiwyg-video-dialog-dropzone"
        [class.wysiwyg-video-dialog-dropzone--over]="isDragOver"
        (click)="videoFileInput.click()"
        (dragover)="onDragOver($event)"
        (dragleave)="isDragOver = false"
        (drop)="onFileDrop($event)">
        <input #videoFileInput type="file" accept="video/*" style="display:none" (change)="onFileChange($event)">
        <div *ngIf="!uploadedFileName" class="wysiwyg-video-dialog-dropzone-hint">
          Drop video (or click)
        </div>
        <div *ngIf="uploadedFileName" class="wysiwyg-video-dialog-dropzone-filename">
          {{ uploadedFileName }}
        </div>
      </div>
      <div *ngIf="uploadError" class="wysiwyg-error-message">{{ uploadError }}</div>
      <div class="wysiwyg-video-dialog-actions">
        <button type="button" class="wysiwyg-btn wysiwyg-btn-secondary" (click)="onCancel()">Cancel</button>
        <button type="button" class="wysiwyg-btn wysiwyg-btn-primary"
          [disabled]="!uploadedVideoUrl || isUploading"
          (click)="onSubmitUpload()">
          {{ isUploading ? 'Uploading...' : 'Insert Video' }}
        </button>
      </div>
    </div>

  </div>
</div>
