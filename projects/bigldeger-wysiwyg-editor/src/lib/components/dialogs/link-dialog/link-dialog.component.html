<div class="wysiwyg-link-dialog-overlay" *ngIf="visible" (click)="onCancel()">
  <div class="wysiwyg-link-dialog" (click)="$event.stopPropagation()">
    <div class="wysiwyg-link-dialog-header">
      <h3>{{ isEditing ? 'Edit Link' : 'Insert Link' }}</h3>
      <button 
        type="button" 
        class="wysiwyg-link-dialog-close"
        (click)="onCancel()"
        aria-label="Close dialog">
        ×
      </button>
    </div>

    <form [formGroup]="linkForm" (ngSubmit)="onSubmit()" class="wysiwyg-link-dialog-form">
      <div class="wysiwyg-form-group">
        <label for="linkUrl">URL *</label>
        <input 
          id="linkUrl"
          type="text" 
          formControlName="url"
          placeholder="https://example.com or /relative/path"
          [class.error]="hasFieldError('url')"
          autocomplete="url">
        <div class="wysiwyg-error-message" *ngIf="hasFieldError('url')">
          {{ getFieldError('url') }}
        </div>
      </div>

      <div class="wysiwyg-form-group">
        <label for="linkText">Link Text *</label>
        <input 
          id="linkText"
          type="text" 
          formControlName="text"
          placeholder="Enter link text"
          [class.error]="hasFieldError('text')">
        <div class="wysiwyg-error-message" *ngIf="hasFieldError('text')">
          {{ getFieldError('text') }}
        </div>
      </div>

      <div class="wysiwyg-form-group">
        <label for="linkTitle">Title (optional)</label>
        <input 
          id="linkTitle"
          type="text" 
          formControlName="title"
          placeholder="Enter link title (tooltip text)">
      </div>

      <div class="wysiwyg-form-group">
        <label for="linkTarget">Open in</label>
        <select id="linkTarget" formControlName="target">
          <option value="_blank">New window/tab</option>
          <option value="_self">Same window</option>
          <option value="_parent">Parent frame</option>
          <option value="_top">Top frame</option>
        </select>
      </div>

      <div class="wysiwyg-link-dialog-actions">
        <button 
          type="button" 
          class="wysiwyg-btn wysiwyg-btn-secondary"
          (click)="onCancel()">
          Cancel
        </button>
        
        <button 
          *ngIf="isEditing"
          type="button" 
          class="wysiwyg-btn wysiwyg-btn-danger"
          (click)="onRemoveLink()">
          Remove Link
        </button>
        
        <button 
          type="submit" 
          class="wysiwyg-btn wysiwyg-btn-primary"
          [disabled]="!linkForm.valid">
          {{ isEditing ? 'Update Link' : 'Insert Link' }}
        </button>
      </div>
    </form>
  </div>
</div>
