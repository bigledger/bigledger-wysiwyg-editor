<div class="wysiwyg-image-dialog-overlay" *ngIf="visible" (click)="onCancel()">
  <div class="wysiwyg-image-dialog" (click)="$event.stopPropagation()">
    <div class="wysiwyg-image-dialog-header">
      <h3>{{ isEditing ? 'Edit Image' : 'Insert Image' }}</h3>
      <button 
        type="button" 
        class="wysiwyg-image-dialog-close"
        (click)="onCancel()"
        aria-label="Close dialog">
        ×
      </button>
    </div>

    <!-- Tab Navigation -->
    <div class="wysiwyg-image-tabs" *ngIf="!isEditing">
      <button 
        type="button"
        class="wysiwyg-tab-button"
        [class.active]="activeTab === 'url'"
        (click)="switchTab('url')">
        URL
      </button>
      <button 
        type="button"
        class="wysiwyg-tab-button"
        [class.active]="activeTab === 'upload'"
        (click)="switchTab('upload')">
        Upload
      </button>
    </div>

    <form [formGroup]="imageForm" (ngSubmit)="onSubmit()" class="wysiwyg-image-dialog-form">
      
      <!-- URL Tab Content -->
      <div class="wysiwyg-tab-content" *ngIf="activeTab === 'url'">
        <div class="wysiwyg-form-group">
          <label for="imageUrl">Image URL *</label>
          <input 
            id="imageUrl"
            type="text" 
            formControlName="src"
            placeholder="https://example.com/image.jpg or /path/to/image.jpg"
            [class.error]="hasFieldError('src')"
            (input)="onUrlChange()"
            autocomplete="url">
          <div class="wysiwyg-error-message" *ngIf="hasFieldError('src')">
            {{ getFieldError('src') }}
          </div>
        </div>
      </div>

      <!-- Upload Tab Content -->
      <div class="wysiwyg-tab-content" *ngIf="activeTab === 'upload'">
        <div class="wysiwyg-form-group">
          <label for="imageFile">Select Image File *</label>
          <div class="wysiwyg-file-input-wrapper">
            <input 
              id="imageFile"
              type="file" 
              accept="image/jpeg,image/jpg,image/png,image/gif,image/webp,image/svg+xml"
              (change)="onFileSelected($event)"
              class="wysiwyg-file-input">
            <button 
              type="button" 
              class="wysiwyg-file-button"
              onclick="document.getElementById('imageFile')?.click()">
              Choose File
            </button>
            <span class="wysiwyg-file-name">
              {{ selectedFile ? selectedFile.name : 'No file selected' }}
            </span>
          </div>
          <div class="wysiwyg-file-info">
            Supported formats: JPEG, PNG, GIF, WebP, SVG (max 5MB)
          </div>
          <div class="wysiwyg-error-message" *ngIf="hasFileError()">
            {{ getFileError() }}
          </div>
        </div>
      </div>

      <!-- Image Preview -->
      <div class="wysiwyg-form-group wysiwyg-image-preview-group" *ngIf="previewUrl">
        <label>Preview</label>
        <div class="wysiwyg-image-preview">
          <img [src]="previewUrl" [alt]="imageForm.get('alt')?.value || 'Image preview'" />
        </div>
      </div>

      <!-- Common Form Fields -->
      <div class="wysiwyg-form-group">
        <label for="imageAlt">Alt Text *</label>
        <input 
          id="imageAlt"
          type="text" 
          formControlName="alt"
          placeholder="Describe the image for accessibility"
          [class.error]="hasFieldError('alt')">
        <div class="wysiwyg-error-message" *ngIf="hasFieldError('alt')">
          {{ getFieldError('alt') }}
        </div>
      </div>

      <div class="wysiwyg-form-group">
        <label for="imageTitle">Title (optional)</label>
        <input 
          id="imageTitle"
          type="text" 
          formControlName="title"
          placeholder="Enter image title (tooltip text)">
      </div>

      <div class="wysiwyg-form-row">
        <div class="wysiwyg-form-group wysiwyg-form-group-half">
          <label for="imageWidth">Width (px)</label>
          <input 
            id="imageWidth"
            type="number" 
            formControlName="width"
            placeholder="Auto"
            min="1"
            max="2000"
            [class.error]="hasFieldError('width')">
          <div class="wysiwyg-error-message" *ngIf="hasFieldError('width')">
            {{ getFieldError('width') }}
          </div>
        </div>

        <div class="wysiwyg-form-group wysiwyg-form-group-half">
          <label for="imageHeight">Height (px)</label>
          <input 
            id="imageHeight"
            type="number" 
            formControlName="height"
            placeholder="Auto"
            min="1"
            max="2000"
            [class.error]="hasFieldError('height')">
          <div class="wysiwyg-error-message" *ngIf="hasFieldError('height')">
            {{ getFieldError('height') }}
          </div>
        </div>
      </div>

      <div class="wysiwyg-image-dialog-actions">
        <button 
          type="button" 
          class="wysiwyg-btn wysiwyg-btn-secondary"
          (click)="onCancel()">
          Cancel
        </button>
        
        <button 
          *ngIf="isEditing"
          type="button" 
          class="wysiwyg-btn wysiwyg-btn-danger"
          (click)="onRemoveImage()">
          Remove Image
        </button>
        
        <button 
          type="submit" 
          class="wysiwyg-btn wysiwyg-btn-primary"
          [disabled]="!isFormValid()">
          {{ isEditing ? 'Update Image' : 'Insert Image' }}
        </button>
      </div>
    </form>
  </div>
</div>
